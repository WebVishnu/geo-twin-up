name: daily-forecast-log
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy pyarrow requests
      - run: python -m src.ingest.forecast_logger
      - name: Commit new forecast file (also keeps the schedule alive)
        run: |
          git config user.name "geo-twin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/forecast_log
          git diff --cached --quiet || git commit -m "data: forecast log $(date -u +%F)"
          git push
