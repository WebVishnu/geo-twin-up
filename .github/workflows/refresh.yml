name: daily-forecast-log
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy pyarrow requests geopandas shapely
      - run: python -m src.ingest.forecast_logger
      - name: Export district forecast for the dashboard
        run: python scripts/export_app_data.py --forecast-only
      - name: Commit new data (also keeps the schedule alive; a push redeploys the dashboard)
        run: |
          git config user.name "geo-twin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/forecast_log app_data/forecast.parquet
          git diff --cached --quiet || git commit -m "data: forecast log $(date -u +%F)"
          git pull --rebase -q
          git push
